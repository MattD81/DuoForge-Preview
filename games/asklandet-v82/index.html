<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asklandet 3D – Startar</title><style>html,body{height:100%;margin:0;background:#15201b;color:#dce8d2;font:16px system-ui;display:grid;place-items:center;text-align:center}main{max-width:360px;padding:24px}button{background:#477951;border:1px solid #a5d5a2;color:white;border-radius:12px;padding:14px 24px;font-size:18px}#msg{line-height:1.6}</style><main><h1>🌲 Asklandet 3D</h1><p id="msg">Laddar spelvärlden …</p><button id="retry" hidden>Försök igen</button></main><script>const parts=16;async function load(){document.getElementById('retry').hidden=true;try{let out=new Array(parts);for(let i=0;i<parts;i+=4){let batch=await Promise.all(Array.from({length:Math.min(4,parts-i)},(_,j)=>fetch('assets/part-'+String(i+j).padStart(2,'0')+'.txt',{cache:'force-cache'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()})));batch.forEach((s,j)=>out[i+j]=s);document.getElementById('msg').textContent='Laddar 3D-miljön '+Math.round(Math.min(parts,i+batch.length)/parts*100)+' %';}let html=out.join('');if(!html.startsWith('<!doctype html>')||!html.includes('Asklandet'))throw Error('Ofullständig spelfil');document.open();document.write(html);document.close()}catch(e){document.getElementById('msg').textContent='Kunde inte ladda spelet: '+e.message;document.getElementById('retry').hidden=false}}document.getElementById('retry').onclick=load;load();</script></html>
