<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Asködemarken – DuoForge</title><style>html,body{margin:0;background:#171b18;color:#e8e4d4;font:16px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:10px;left:10px;background:#111b;padding:12px;border:1px solid #9a9b75;border-radius:8px;max-width:270px}#hud b{color:#d6e3a2}#pad{position:fixed;bottom:20px;left:15px;display:grid;grid-template-columns:repeat(3,50px);gap:5px}button{background:#283e30;color:white;border:1px solid #8a9b77;border-radius:10px;font-size:22px;min-height:50px}#shoot{position:fixed;right:18px;bottom:34px;width:84px;height:84px;border-radius:50%;background:#6c4c37}#hint{position:fixed;right:12px;top:12px;background:#111a;padding:9px;border-radius:6px;font-size:12px}</style><canvas id="c"></canvas><div id="hud"><b>ASKÖDEMARKEN · PROTOTYP</b><div id="stats"></div><small>Utforska ruinerna. Hitta förnödenheter. Undvik väktarna.</small></div><div id="hint">Dator: WASD + mus/drag · klicka för att skjuta<br>Mobil: pilar + dra för att se</div><div id="pad"><span></span><button data-k="w">▲</button><span></span><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div><button id="shoot">⚡</button><script>
const c=document.querySelector('#c'),g=c.getContext('2d');let W=0,H=0;function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio}addEventListener('resize',resize);resize();let px=0,pz=0,yaw=0,health=100,ammo=24,scrap=0,kills=0,flash=0;const keys=new Set();addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();keys.add(b.dataset.k);b.setPointerCapture(e.pointerId)};b.onpointerup=()=>keys.delete(b.dataset.k);b.onpointercancel=()=>keys.delete(b.dataset.k)});let drag=false,lastX=0;c.onpointerdown=e=>{drag=true;lastX=e.clientX};c.onpointermove=e=>{if(drag){yaw+=(e.clientX-lastX)*.006;lastX=e.clientX}};c.onpointerup=()=>drag=false;
let seed=10473;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const objects=[];for(let i=0;i<230;i++){let x=(rand()-.5)*260,z=(rand()-.5)*260;objects.push({x,z,type:rand()<.37?'tree':rand()<.66?'rock':'grass',size:1+rand()*2})}for(let i=0;i<34;i++){objects.push({x:(rand()-.5)*220,z:(rand()-.5)*220,type:'house',size:2+rand()*2})}const foes=[];for(let i=0;i<18;i++)foes.push({x:(rand()-.5)*180,z:(rand()-.5)*180,hp:3,phase:rand()*7});const loot=[];for(let i=0;i<28;i++)loot.push({x:(rand()-.5)*200,z:(rand()-.5)*200,taken:false});function project(x,y,z){let dx=x-px,dz=z-pz,rx=dx*Math.cos(yaw)-dz*Math.sin(yaw),rz=dx*Math.sin(yaw)+dz*Math.cos(yaw);if(rz<.3)return null;let f=Math.min(W,H)*.9/rz;return {x:W/2+rx*f,y:H*.54-y*f,s:f,d:rz}}function poly(pts,col){g.fillStyle=col;g.beginPath();g.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)g.lineTo(pts[i].x,pts[i].y);g.closePath();g.fill()}function rect3(x,y,z,w,h,col){let p=project(x,y,z);if(!p)return;g.fillStyle=col;g.fillRect(p.x-w*p.s/2,p.y-h*p.s,w*p.s,h*p.s)}function shoot(){if(ammo<=0)return;ammo--;flash=8;let target=null,dist=1e9;for(const f of foes){if(f.hp<=0)continue;let p=project(f.x,1.1,f.z);if(p&&Math.abs(p.x-W/2)<Math.max(20*devicePixelRatio,p.s*.65)&&p.d<dist){target=f;dist=p.d}}if(target&&dist<65){target.hp--;if(target.hp<=0){kills++;scrap+=3}}}document.querySelector('#shoot').onclick=shoot;c.addEventListener('click',e=>{if(e.pointerType==='mouse')shoot()});let last=performance.now();function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;let speed=7*dt,dx=0,dz=0;if(keys.has('w')||keys.has('arrowup'))dz+=speed;if(keys.has('s')||keys.has('arrowdown'))dz-=speed;if(keys.has('a')||keys.has('arrowleft'))dx-=speed;if(keys.has('d')||keys.has('arrowright'))dx+=speed;px+=dx*Math.cos(yaw)+dz*Math.sin(yaw);pz+=dz*Math.cos(yaw)-dx*Math.sin(yaw);let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#4b504d');sky.addColorStop(.54,'#b6a68a');sky.addColorStop(.55,'#605d46');sky.addColorStop(1,'#292b24');g.fillStyle=sky;g.fillRect(0,0,W,H);const draw=[];for(let o of objects){let p=project(o.x,0,o.z);if(p&&p.d<110)draw.push({p,o})}for(let f of foes){if(f.hp<=0)continue;let p=project(f.x,0,f.z);if(p&&p.d<110)draw.push({p,o:{...f,type:'foe'}});if(Math.hypot(f.x-px,f.z-pz)<2.2){health=Math.max(0,health-dt*6)}}for(let l of loot){if(l.taken)continue;if(Math.hypot(l.x-px,l.z-pz)<2){l.taken=true;scrap+=5;ammo+=4}let p=project(l.x,0,l.z);if(p&&p.d<110)draw.push({p,o:{...l,type:'loot'}})}draw.sort((a,b)=>b.p.d-a.p.d);for(let {p,o} of draw){let s=p.s;if(o.type==='house'){rect3(o.x,3*o.size,o.z,2.5*o.size,3*o.size,'#777267');rect3(o.x,1.2*o.size,o.z,1*o.size,1.5*o.size,'#272a28');let a=project(o.x-1.6*o.size,3*o.size,o.z),b=project(o.x+1.6*o.size,3*o.size,o.z),t=project(o.x,5*o.size,o.z);if(a&&b&&t)poly([a,b,t],'#4c4840')}else if(o.type==='tree'){rect3(o.x,2*o.size,o.z,.32*o.size,4*o.size,'#494036');for(let j=0;j<4;j++){let a=project(o.x-1.5*o.size,(2+j*.8)*o.size,o.z),b=project(o.x+1.5*o.size,(2+j*.8)*o.size,o.z),t=project(o.x,(5+j*.2)*o.size,o.z);if(a&&b&&t)poly([a,b,t,j%2?'#354336':'#455445'])}}else if(o.type==='rock'){rect3(o.x,.35*o.size,o.z,1.3*o.size,.7*o.size,'#68665e')}else if(o.type==='grass'){for(let j=0;j<5;j++){let a=project(o.x+(j-2)*.18,.0,o.z),b=project(o.x+(j-2)*.18+.07,.45*o.size,o.z);if(a&&b){g.strokeStyle=j%2?'#5e6746':'#81866a';g.lineWidth=Math.max(1,s*.035);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}}}else if(o.type==='foe'){rect3(o.x,1.2,o.z,1.1,2.2,'#554d43');rect3(o.x,2.5,o.z,.7,.6,'#a69d83');rect3(o.x,2.5,o.z,.25,.12,'#dc6e45')}else if(o.type==='loot'){rect3(o.x,.5,o.z,.8,.8,'#a69a5d')}}let fog=g.createLinearGradient(0,H*.3,0,H);fog.addColorStop(0,'#a6a28a00');fog.addColorStop(1,'#676a5429');g.fillStyle=fog;g.fillRect(0,0,W,H);g.strokeStyle='#ddd8b7';g.lineWidth=2*devicePixelRatio;g.beginPath();g.moveTo(W/2-8,H/2);g.lineTo(W/2+8,H/2);g.moveTo(W/2,H/2-8);g.lineTo(W/2,H/2+8);g.stroke();if(flash>0){flash--;g.fillStyle='#e8d19e88';g.beginPath();g.arc(W*.53,H*.77,25*devicePixelRatio,0,7);g.fill()}document.querySelector('#stats').textContent=' Hälsa '+Math.round(health)+' · Energi '+ammo+' · Skrot '+scrap+' · Väktare '+kills;requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
