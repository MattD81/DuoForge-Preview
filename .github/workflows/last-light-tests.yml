name: Test LAST LIGHT — DuoForge 3D showcase
on:
  pull_request:
    paths:
      - "games/last-light/**"
      - "workshop/studio/ocean-water.mjs"
      - "workshop/studio/ocean-spectrum.mjs"
      - "workshop/studio/atmosphere-scattering.mjs"
      - ".github/workflows/last-light-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: last-light-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playable:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and deterministic rescue tests
        run: |
          node --check games/last-light/main.mjs
          node --check games/last-light/world.mjs
          node --check games/last-light/ship.mjs
          node --check games/last-light/gameplay.mjs
          node --check games/last-light/game-smoke.mjs
          node --check games/last-light/coastal-terrain.mjs
          node --check games/last-light/coastal-world.mjs
          node --check games/last-light/wake-trails.mjs
          node --check games/last-light/pbr-materials.mjs
          node --check games/last-light/raytrace.mjs
          node --test games/last-light/gameplay.test.mjs games/last-light/coastal-terrain.test.mjs
      - name: Install Playwright (test only)
        timeout-minutes: 2
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        timeout-minutes: 3
        run: npx playwright install chromium --only-shell
      - name: Start local Pages-style HTTP server
        run: python3 -m http.server 8080 --bind 127.0.0.1 --directory . > /tmp/last-light-server.log 2>&1 &
      - name: Playable WebGL game, mobile, GLB and visual smoke
        run: node games/last-light/game-smoke.mjs
      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-light-screenshots
          path: |
            last-light-intro-desktop.png
            last-light-storm-desktop.png
            last-light-mobile.png
          if-no-files-found: ignore
