name: Test DuoForge 3D Studio
on:
  pull_request:
    paths:
      - 'workshop/studio/**'
      - 'index.html'
      - 'workshop/models.json'
      - 'tests/studio-smoke.mjs'
      - 'tests/v5-aurora-smoke.mjs'
      - 'tests/character-forge-smoke.mjs'
      - 'tests/living-objects-smoke.mjs'
      - 'tests/living-physics.test.mjs'
      - 'tests/world-builder-smoke.mjs'
      - 'tests/world-planner.test.mjs'
      - 'tests/wheel-rig-smoke.mjs'
      - 'tests/steering-controls-smoke.mjs'
      - 'tests/render-world-smoke.mjs'
      - 'tests/ocean-world-smoke.mjs'
      - 'tests/ocean-spectrum.test.mjs'
      - 'tests/research-3d.test.mjs'
      - 'tests/fusion-engine.test.mjs'
      - 'tests/fusion-lab-smoke.mjs'
      - 'tests/gpu-deluxe.test.mjs'
      - 'tests/gpu-deluxe-v2.test.mjs'
      - 'tests/gpu-deluxe-v2-smoke.mjs'
      - 'tests/research-stack.test.mjs'
      - 'tests/research-stack-smoke.mjs'
      - 'tests/sites-cinema-bridge.test.mjs'
      - 'tests/sites-cinema-bridge-smoke.mjs'
      - 'tests/film-studio-smoke.mjs'
      - 'tests/film-path.test.mjs'
      - 'tests/cinema-production.test.mjs'
      - 'tests/cinema-engine-core.test.mjs'
      - 'tests/cinema-denoise.test.mjs'
      - 'tests/cinema-wavelet-denoise.test.mjs'
      - 'tests/cinema-video-assembly.test.mjs'
      - 'tests/render-missions.test.mjs'
      - 'tests/surface-classifier.test.mjs'
      - 'tests/material-lab-smoke.mjs'
      - 'tests/one-click-texturing.test.mjs'
      - 'tests/one-click-texturing-browser.mjs'
      - 'tests/sites-one-click-bridge.test.mjs'
      - '.github/workflows/studio-tests.yml'
  workflow_dispatch:
concurrency:
  group: studio-tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  studio-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax check
        run: |
          node --check workshop/studio/fusion-engine.mjs
          node --check workshop/studio/fusion-lab.mjs
          node --check workshop/studio/studio.mjs
          node --check workshop/studio/v5-aurora.mjs
          node --check tests/v5-aurora-smoke.mjs
          node --check workshop/studio/research-ui.mjs
          node --check workshop/studio/research-performance.mjs
          node --check workshop/studio/research-stack-core.mjs
          node --check workshop/studio/research-stack-ui.mjs
          node --check workshop/studio/gaussian-preview.mjs
          node --check tests/research-stack.test.mjs
          node --check tests/research-stack-smoke.mjs
          node --check workshop/studio/atmosphere-scattering.mjs
          node --check tests/research-3d.test.mjs
          node --check workshop/studio/sites-cinema-bridge.mjs
          node --check tests/sites-cinema-bridge-smoke.mjs
          node --check workshop/studio/character-forge.mjs
          node --check workshop/studio/image-to-3d-client.mjs
          python3 -m py_compile services/image-to-3d/server.py
          node --check tests/character-forge-smoke.mjs
          node --check workshop/studio/living-objects.mjs
          node --check workshop/studio/living-physics.mjs
          node --check workshop/studio/world-planner.mjs
          node --check workshop/studio/world-builder.mjs
          node --check workshop/studio/wheel-rig.mjs
          node --check workshop/studio/render-world.mjs
          node --check workshop/studio/render-environments.mjs
          node --check workshop/studio/ocean-water.mjs
          node --check workshop/studio/ocean-spectrum.mjs
          node --check workshop/studio/ocean-scene.mjs
          node --check workshop/studio/cinematic-lighting.mjs
          node --check workshop/studio/cinema-production.mjs
          node --check workshop/studio/cinema-engine-core.mjs
          node --check workshop/studio/cinema-gpu-engine.mjs
          node --check workshop/studio/cinema-denoise.mjs
          node --check workshop/studio/cinema-wavelet-denoise.mjs
          node --check workshop/studio/cinema-rig.mjs
          node --check workshop/studio/cinema-path-film.mjs
          node --check workshop/studio/cinema-video-assembly.mjs
          node --check workshop/studio/film-path.mjs
          node --check workshop/studio/path-trace-stills.mjs
          node --check workshop/studio/film-studio.mjs
          node --check tests/film-studio-smoke.mjs
          node --check tests/ocean-world-smoke.mjs
          node --check workshop/studio/render-missions.mjs
          node --check workshop/studio/procedural-materials.mjs
          node --check workshop/studio/material-lab.mjs
          node --check workshop/studio/one-click-texturing-core.mjs
          node --check workshop/studio/one-click-texturing.mjs
          node --check tests/one-click-texturing-browser.mjs
          node --test tests/pbr-vault-core.test.mjs tests/one-click-texturing.test.mjs tests/sites-cinema-bridge.test.mjs tests/sites-one-click-bridge.test.mjs
          node --check workshop/studio/surface-classifier.mjs
          node --check tests/material-lab-smoke.mjs
          node --check tests/render-world-smoke.mjs
          node --check tests/wheel-rig-smoke.mjs
          node --check tests/steering-controls-smoke.mjs
          node --check tests/studio-smoke.mjs
          node --check tests/living-objects-smoke.mjs
          node --test tests/cinema-engine-core.test.mjs
          node --test tests/sites-cinema-bridge.test.mjs
          node --check workshop/studio/gpu-deluxe-v2.mjs
          node --check workshop/studio/gpu-deluxe-v2-effects.mjs
          node --check workshop/studio/gpu-deluxe-v2-studio.mjs
          node --check tests/gpu-deluxe-v2-smoke.mjs
          node --test tests/fusion-engine.test.mjs tests/gpu-deluxe.test.mjs tests/gpu-deluxe-v2.test.mjs
          node --test tests/ocean-spectrum.test.mjs tests/research-3d.test.mjs tests/research-stack.test.mjs
          node --test tests/living-physics.test.mjs tests/world-planner.test.mjs tests/render-missions.test.mjs tests/surface-classifier.test.mjs tests/film-path.test.mjs tests/cinema-production.test.mjs tests/cinema-denoise.test.mjs tests/cinema-wavelet-denoise.test.mjs tests/cinema-video-assembly.test.mjs
      - name: Install Playwright (test-only)
        timeout-minutes: 3
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install lightweight headless Chromium
        timeout-minutes: 4
        run: npx playwright install chromium --only-shell
      - name: Start local static server
        run: python3 -m http.server 8080 --bind 127.0.0.1 --directory . >/tmp/duoforge-server.log 2>&1 &
      - name: Verify single-click texturing, protected materials and GLB maps in desktop/mobile
        run: node tests/one-click-texturing-browser.mjs
      - name: Test Film Studio cinematic video rendering, Full HD PNG and storyboard
        run: node tests/film-studio-smoke.mjs
      - name: Verify cross-origin Sites↔Cinema integration with a real GLB
        run: node tests/sites-cinema-bridge-smoke.mjs
      - name: Test Ocean Render World waves, storm, preview, desktop and mobile
        run: node tests/ocean-world-smoke.mjs
      - name: Test PBR Material Lab and real GLB embedded texture roundtrip
        run: node tests/material-lab-smoke.mjs
      - name: Test render-world environments, controls and preview restoration
        run: node tests/render-world-smoke.mjs
      - name: Verify Vortex steering on keyboard, gamepad and mobile
        run: node tests/steering-controls-smoke.mjs
      - name: Test editing and downloads in Chromium
        run: node tests/studio-smoke.mjs
      - name: Test original AURORA V5 model, mobile viewport and GLB export
        run: node tests/v5-aurora-smoke.mjs
      - name: Test GPU Deluxe V2 effects on desktop and mobile
        run: node tests/gpu-deluxe-v2-smoke.mjs
      - name: Test free research stack in browser and mobile
        run: node tests/research-stack-smoke.mjs
      - name: Test Fusion Lab
        run: node tests/fusion-lab-smoke.mjs
      - name: Test Character Forge volumetric GLB and image silhouettes
        run: node tests/character-forge-smoke.mjs
      - name: Test Living Objects and Play & Build in Chromium
        run: node tests/living-objects-smoke.mjs
      - name: Test free Swedish text-to-world generation in Chromium
        run: node tests/world-builder-smoke.mjs
      - name: Verify Vortex wheel rig and non-destructive GLB wheel animation
        run: node tests/wheel-rig-smoke.mjs
      - name: Upload screenshots if tests ran
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duoforge-studio-smoke-screenshots
          path: |
            studio-desktop.png
            studio-mobile.png
            character-forge-desktop.png
            character-forge-mobile.png
            living-desktop.png
            living-mobile.png
            world-builder-desktop.png
            render-world-desktop.png
            render-world-mobile.png
            ocean-render-world-desktop.png
            ocean-sunset.png
            ocean-render-world-mobile.png
            film-studio-desktop.png
            film-studio-mobile.png
            material-world-desktop.png
            material-lab-mobile.png
            one-click-mobile.png
          if-no-files-found: ignore

