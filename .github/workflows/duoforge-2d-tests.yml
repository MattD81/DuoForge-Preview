name: DuoForge 2D Deluxe — engine + playable game
on:
  pull_request:
    paths:
      - "services/duoforge-2d/**"
      - "games/lantern-vale/**"
      - "tests/duoforge-2d*"
      - ".github/workflows/duoforge-2d-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: duoforge-2d-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check original 2D engine and deterministic physics tests
        run: |
          node --check services/duoforge-2d/physics.mjs
          node --check services/duoforge-2d/renderer.mjs
          node --check services/duoforge-2d/world.mjs
          node --check services/duoforge-2d/skeleton.mjs
          node --check games/lantern-vale/main.mjs
          node --check tests/duoforge-2d-smoke.mjs
          node --test tests/duoforge-2d.test.mjs
      - name: Install Chromium smoke-test runner only
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Start GitHub Pages equivalent
        run: python3 -m http.server 8080 --bind 127.0.0.1 --directory . > /tmp/duoforge-2d-http.log 2>&1 &
      - name: Real browser visual, touch and gameplay test
        timeout-minutes: 4
        run: node tests/duoforge-2d-smoke.mjs
      - name: Upload real visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duoforge-2d-deluxe-visuals
          path: |
            duoforge-2d-desktop.png
            duoforge-2d-action.png
            duoforge-2d-portrait.png
          if-no-files-found: ignore
