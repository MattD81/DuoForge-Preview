name: Test Aetherfall Fusion Game
on:
  pull_request:
    paths:
      - 'games/aetherfall/**'
      - 'tests/aetherfall-smoke.mjs'
      - '.github/workflows/aetherfall-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aetherfall-game-${{ github.ref }}
  cancel-in-progress: true
jobs:
  aetherfall-play:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax and level logic
        run: |
          node --check games/aetherfall/main.mjs
          node --check games/aetherfall/world.mjs
          node --check games/aetherfall/logic.mjs
          node --check games/aetherfall/fusion-engine.mjs
          node --check tests/aetherfall-smoke.mjs
          node --test games/aetherfall/logic.test.mjs
          node --test games/aetherfall/fusion-engine.test.mjs
      - name: Install Playwright and test Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Start static server
        run: python3 -m http.server 8080 --bind 127.0.0.1 --directory . >/tmp/aetherfall-server.log 2>&1 &
      - name: Verify actual 3D and mobile game
        run: node tests/aetherfall-smoke.mjs
      - name: Upload game screenshots on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aetherfall-desktop-mobile
          path: |
            aetherfall-desktop.png
            aetherfall-mobile.png
          if-no-files-found: ignore
